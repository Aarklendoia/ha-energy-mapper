<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Energy Mapper panel (dev harness)</title>
    <!--
      Dev harness, not shipped: mounts the built panel with a fake `hass` whose
      callWS answers from the SYNTHETIC sample data of dev/sample/.
      From the repository root:
        (cd frontend && npm run build) && python3 -m http.server 8765
      then open http://localhost:8765/frontend/dev/index.html
      (options: theme=dark, language=fr, admin=0, scenario=empty|many, tab=, bare=1)
      The HA elements (ha-alert, ha-date-range-nav...) are not defined here:
      the panel's own fallbacks are what you see (a native date input instead
      of HA's date picker).
    -->
    <style>
      /* default theme of Home Assistant (approximation) */
      html {
        --primary-color: #009ac7;
        --accent-color: #ff9800;
        --primary-background-color: #fafafa;
        --secondary-background-color: #e5e5e5;
        --card-background-color: #ffffff;
        --primary-text-color: #212121;
        --secondary-text-color: #727272;
        --text-primary-color: #ffffff;
        --disabled-text-color: #bdbdbd;
        --disabled-color: #bdbdbd;
        --divider-color: rgba(0, 0, 0, 0.12);
        --error-color: #db4437;
        --warning-color: #ffa600;
        --success-color: #43a047;
        --info-color: #039be5;
        --energy-solar-color: #ff9800;
        /* the header of the current HA default theme (light, with a divider) */
        --app-header-background-color: var(--primary-background-color);
        --app-header-text-color: var(--primary-text-color);
        --app-header-border-bottom: 1px solid var(--divider-color);
        --ha-card-border-radius: 12px;
        --ha-card-border-color: #e0e0e0;
        color-scheme: light;
      }
      html.dark {
        --primary-background-color: #111111;
        --secondary-background-color: #282828;
        --card-background-color: #1c1c1c;
        --primary-text-color: #e1e1e1;
        --secondary-text-color: #9b9b9b;
        --disabled-text-color: #6f6f6f;
        --disabled-color: #6f6f6f;
        --divider-color: rgba(225, 225, 225, 0.12);
        --app-header-background-color: #101e24;
        --app-header-text-color: #e1e1e1;
        --ha-card-border-color: rgba(225, 225, 225, 0.12);
        color-scheme: dark;
      }
      body {
        margin: 0;
        font-family: Roboto, Noto, sans-serif;
        background: var(--primary-background-color);
      }
      #dev {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        padding: 6px 12px;
        font: 12px monospace;
        background: #333;
        color: #eee;
      }
    </style>
  </head>
  <body>
    <div id="dev">
      <label>theme <select id="theme"><option>light</option><option>dark</option></select></label>
      <label>language <select id="language"><option>en</option><option>fr</option></select></label>
      <label>numbers
        <select id="number_format">
          <option>language</option><option>comma_decimal</option><option>decimal_comma</option>
          <option>space_comma</option><option>none</option>
        </select>
      </label>
      <label>time <select id="time_format"><option>language</option><option>12</option><option>24</option></select></label>
      <label>scenario
        <select id="scenario">
          <option value="ok">add-on running</option>
          <option value="unavailable">add-on unavailable</option>
          <option value="not_configured">not configured</option>
          <option value="empty">no report yet</option>
          <option value="many">30+ signatures to review</option>
        </select>
      </label>
      <label><input type="checkbox" id="admin" checked /> admin</label>
    </div>
    <energy-mapper-panel></energy-mapper-panel>

    <script type="module">
      import "../../custom_components/energy_mapper/frontend/energy-mapper-panel.js";

      // the synthetic days are in March 2027: the harness lives on the day after them
      const offset = Date.UTC(2027, 2, 10, 11) - Date.now();
      const realNow = Date.now;
      Date.now = () => realNow() + offset;

      const $ = (id) => document.getElementById(id);
      const params = new URLSearchParams(location.search);
      for (const id of ["theme", "language", "number_format", "time_format", "scenario"]) {
        if (params.has(id)) $(id).value = params.get(id);
      }
      if (params.get("admin") === "0") $("admin").checked = false;
      // ?bare=1: without the developer bar (README screenshots)
      if (params.get("bare") === "1") $("dev").style.display = "none";

      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
      const sample = async (name) => (await fetch(`sample/${name}.json`)).json();

      async function callWS(msg) {
        const scenario = $("scenario").value;
        await sleep(150);
        switch (msg.type) {
          case "energy_mapper/status": {
            const configured = scenario !== "not_configured";
            const available = configured && scenario !== "unavailable";
            return {
              configured,
              state: configured ? (available ? "loaded" : "setup_retry") : null,
              url: configured ? "http://local-energy-mapper:8099" : null,
              available,
              health: available
                ? { status: "ok", version: "0.3.0", last_run: null, days: 3, signatures: 8, storage_bytes: 1 }
                : null,
              error: available || !configured ? null : "Cannot connect to host local-energy-mapper:8099",
              settings: {},
            };
          }
          case "energy_mapper/days":
            return scenario === "empty" ? { days: [], summary_days: [] } : sample("days");
          case "energy_mapper/signatures": {
            if (scenario === "empty") return { signatures: [], switched_loads: [], peak: null };
            const reg = await signatures();
            for (const s of reg.signatures) {
              const owner = APPLIANCE_LIST.find((a) => a.sources.some((x) => x.type === "signature" && x.id === s.id));
              if (owner) {
                s.label = owner.name;
                s.appliance = owner.key;
              }
              if (labels[s.id]) s.label = labels[s.id];
              if (decisions[s.id]?.state === "validated") s.appliance = decisions[s.id].appliance;
            }
            return reg;
          }
          case "energy_mapper/report":
            try {
              return await sample(`report-${msg.day}`);
            } catch {
              throw { code: "not_found", message: `no report for ${msg.day}` };
            }
          case "energy_mapper/day_stats": {
            const out = {};
            for (const day of msg.days) {
              const r = await sample(`report-${day}`).catch(() => null);
              if (!r) continue;
              const notable = r.peaks.filter((p) => p.notable);
              out[day] = {
                house_kwh: r.energy_kwh.house,
                max_house_w: r.max_house_w,
                notable_peaks: notable.length,
                last_notable: notable.length ? Math.max(...notable.map((p) => p.max_ts)) : null,
              };
            }
            return { days: out };
          }
          case "energy_mapper/appliances":
            return { entry_id: "dev-entry", appliances: scenario === "empty" ? [] : APPLIANCE_LIST };
          case "recorder/statistics_during_period":
            return statistics(msg);
          case "energy_mapper/analyze":
            await sleep(1500);
            return { day: msg.day, ok: true };
          case "energy_mapper/review":
            return review();
          case "energy_mapper/validate":
            if (!msg.name?.trim()) throw { code: "invalid_format", message: "expected a name" };
            decisions[msg.signature_id] = { state: "validated", at: NOW, appliance: msg.entity_id ?? msg.signature_id };
            labels[msg.signature_id] = msg.entity_id ? null : msg.name.trim();
            return { appliance: { key: `signature:${msg.signature_id}`, name: msg.name.trim(), sources: [] } };
          case "energy_mapper/merge_signature": {
            const a = APPLIANCES.find((x) => x.key === msg.appliance);
            if (!a) throw { code: "not_found", message: `no appliance ${msg.appliance}` };
            decisions[msg.signature_id] = { state: "validated", at: NOW, appliance: a.key };
            return { appliance: { key: a.key, name: a.name, sources: [] } };
          }
          case "energy_mapper/wait":
          case "energy_mapper/ignore":
          case "energy_mapper/restore": {
            const action = msg.type.split("/")[1];
            const s = (await signatures()).signatures.find((x) => x.id === msg.signature_id);
            if (!s) throw { code: "not_found", message: `no signature ${msg.signature_id}` };
            if (action === "restore") delete decisions[s.id];
            else if (action === "ignore") decisions[s.id] = { state: "ignored", at: NOW };
            else
              decisions[s.id] = {
                state: "waiting",
                at: NOW,
                count: s.count,
                until_count: Math.max(s.count + 1, Math.ceil(s.count * 2)),
                until: NOW + 14 * 86400,
              };
            return { signature: { ...s, review: decisions[s.id] } };
          }
          default:
            throw { code: "unknown_command", message: msg.type };
        }
      }

      // the registry; scenario "many": 28 synthetic signatures more, to review (#51)
      async function signatures() {
        const reg = await sample("signatures");
        if ($("scenario").value !== "many") return reg;
        const day0 = Date.UTC(2027, 2, 3) / 1000 - 3600; // 2027-03-03 00:00 in Paris
        const days = ["2027-03-03", "2027-03-04", "2027-03-05", "2027-03-06", "2027-03-07", "2027-03-08", "2027-03-09"];
        for (let i = 0; i < 28; i++) {
          const power = 150 + ((i * 397) % 2800);
          const cycling = i % 5 === 3;
          const duration = cycling ? 2400 : 120 + ((i * 1013) % 7000);
          const hour = (i * 7) % 24;
          const hours = Array.from({ length: 24 }, (_, h) => (h === hour ? 3 : Math.abs(h - hour) === 1 ? 1 : 0));
          const count = 5 + ((i * 3) % 30);
          const examples = [0, 1, 2].map((k) => {
            const d = 6 - ((i + k * 2) % 7);
            const start = day0 + d * 86400 + hour * 3600 + ((i * 11) % 50) * 60;
            return { day: days[d], start, end: start + duration, power_w: power };
          });
          reg.signatures.push({
            id: `${cycling ? "cyc" : duration < 600 ? "short" : duration < 3600 ? "medium" : "long"}-${power}w-${i}`,
            kind: cycling ? "cycling" : "steady",
            band: cycling ? "session" : duration < 600 ? "short" : duration < 3600 ? "medium" : "long",
            label: null,
            power_w: power,
            duration_s: duration,
            on_s: cycling ? 60 : null,
            period_s: cycling ? 180 : null,
            duty: cycling ? 0.33 : null,
            weight: count * 0.9,
            count,
            days_seen: Math.min(count, 3 + (i % 5)),
            per_week: count / 4,
            first_seen: days[i % 3],
            last_seen: "2027-03-09",
            hours,
            energy_kwh: Math.round(((power * duration) / 3600000) * count * 100) / 100,
            weighted_energy_kwh: Math.round(((power * duration) / 3600000) * count * 90) / 100,
            examples,
            appliance: null,
          });
        }
        return reg;
      }

      // review of the signatures (the add-on's rules, in memory)
      const NOW = Date.UTC(2027, 2, 10, 4, 30) / 1000;
      const decisions = {};
      const labels = {};
      async function review() {
        if ($("scenario").value === "empty") throw { code: "not_found", message: "no review" };
        const reg = await signatures();
        const state = (s) => {
          const d = decisions[s.id];
          if (s.label || labels[s.id] || d?.state === "validated") return "validated";
          if (d?.state === "ignored") return "ignored";
          if (d?.state === "waiting" && s.count < d.until_count && NOW < d.until) return "waiting";
          return s.count >= 5 && s.days_seen >= 3 ? "proposed" : "immature";
        };
        const order = { proposed: 0, waiting: 1, ignored: 2 };
        const sigs = reg.signatures
          .map((s) => ({ ...s, review: decisions[s.id], review_state: state(s) }))
          .filter((s) => s.review_state in order)
          .sort((a, b) => order[a.review_state] - order[b.review_state] || b.weighted_energy_kwh - a.weighted_energy_kwh);
        const counts = { proposed: 0, waiting: 0, ignored: 0, validated: 0 };
        for (const s of reg.signatures) if (state(s) in counts) counts[state(s)]++;
        // entity suggestions (#41): synthetic, on the first proposals
        sigs
          .filter((s) => s.review_state === "proposed")
          .slice(0, SUGGESTIONS.length)
          .forEach((s, i) => (s.suggestions = SUGGESTIONS[i]));
        return {
          criteria: { min_uses: 5, min_days: 3, wait_days: 14, wait_factor: 2 },
          now: NOW,
          counts,
          signatures: sigs,
          repair: true,
          appliances: APPLIANCES,
          suggest: {
            computed_at: NOW,
            days: 7,
            candidates: 9,
            min_score: 0.8,
            unrecorded_domains: ["media_player"],
            unrecorded_entities: 1,
          },
        };
      }
      const suggestion = (entity_id, score, on_states = ["on"]) => ({
        entity_id,
        score,
        on_share: score,
        off_share: score,
        explained: 0.9,
        matches: Math.round(score * 12),
        steps: 12,
        days: 4,
        on_states,
        inverted: on_states[0] === "off",
      });
      // the appliances (config subentries, energy_mapper/appliances, #54): synthetic
      const stat = (key) => {
        const [prefix, id] = key.split(":");
        return `energy_mapper:${prefix}_${id.replace(/[^a-z0-9]+/g, "_")}_energy`;
      };
      const load = (entity_id) => ({ type: "switched_load", entity_id });
      const sig = (id) => ({ type: "signature", id });
      const APPLIANCE_LIST = [
        ["load:switch.water_heater", "Water heater", [load("switch.water_heater")], 2398],
        ["signature:medium-2600w", "Oven", [sig("medium-2600w")], 2600],
        ["signature:medium-2100w", "Dishwasher", [sig("medium-2100w"), load("switch.dishwasher_plug")], 2100],
        ["load:switch.radiator_bedroom", "Bedroom radiator", [load("switch.radiator_bedroom")], 1000],
        ["submeter:sensor.dryer_power", "Dryer", [{ type: "submeter", entity_id: "sensor.dryer_power" }], null],
      ]
        .map(([key, name, sources, power_w]) => ({
          key,
          name,
          subentry_id: `sub-${key}`,
          statistic_id: sources.some((x) => x.type !== "submeter") ? stat(key) : null,
          power_w,
          sources,
        }))
        .sort((a, b) => a.name.localeCompare(b.name));
      // appliances a signature can be merged into (#43)
      const APPLIANCES = APPLIANCE_LIST.map(({ key, name }) => ({ key, name }));

      // recorder/statistics_during_period (period "day", change): from the sample reports
      async function statistics(msg) {
        const out = {};
        const from = Date.parse(msg.start_time);
        const to = Date.parse(msg.end_time);
        const listing = await sample("days");
        const days = [...listing.days, ...listing.summary_days];
        const reports = (await Promise.all(days.map((d) => sample(`report-${d}`).catch(() => null)))).filter(Boolean);
        for (const id of msg.statistic_ids) {
          const a = APPLIANCE_LIST.find((x) => x.statistic_id === id);
          if (!a) continue;
          out[id] = reports
            .filter((r) => r.start * 1000 >= from && r.start * 1000 < to)
            .map((r) => {
              let kwh = 0;
              for (const x of a.sources) {
                if (x.type === "switched_load") {
                  const k = (r.known_loads ?? []).find((l) => l.entity_id === x.entity_id);
                  if (k) kwh += r.energy_kwh.known?.[k.name] ?? 0;
                } else if (x.type === "signature") {
                  for (const d of r.signatures ?? []) {
                    if ((d.registry_id ?? d.id) === x.id) kwh += r.energy_kwh.signatures?.[d.id] ?? 0;
                  }
                }
              }
              return { start: r.start * 1000, end: r.end * 1000, change: Math.round(kwh * 1000) / 1000 };
            });
        }
        return out;
      }
      // a thermostat whose hvac_action contains the uses, in the radiator's device (#43)
      const contained = {
        entity_id: "climate.bedroom",
        attribute: "hvac_action",
        match: "containment",
        score: 0.97,
        contained: 0.97,
        time_share: 0.31,
        used: 0.8,
        matches: 38,
        sessions: 39,
        chance: 1e-15,
        days: 14,
        days_compared: 14,
        on_states: ["heating"],
        inverted: false,
        appliance: { ...APPLIANCES[0], via: "device" },
      };
      const SUGGESTIONS = [
        [contained, suggestion("fan.attic", 0.92)],
        [suggestion("fan.attic", 0.92), suggestion("switch.dishwasher_plug", 0.83)],
        [suggestion("sensor.washer_state", 0.88, ["running"])],
      ];
      // synthetic entities for the entity picker's fallback
      const STATES = Object.fromEntries(
        [
          ["switch.water_heater", "Water heater", null],
          ["switch.radiator_bedroom", "Bedroom radiator (pilot wire)", null],
          ["climate.bedroom", "Bedroom", null],
          ["switch.dishwasher_plug", "Dishwasher plug", null],
          ["sensor.dishwasher_plug_power", "Dishwasher plug power", "power"],
          ["sensor.heat_pump_power", "Heat pump power", "power"],
          ["sensor.outdoor_temperature", "Outdoor temperature", "temperature"],
          ["fan.attic", "Attic fan", null],
          ["sensor.washer_state", "Washing machine state", "enum"],
        ].map(([id, name, dc]) => [id, { entity_id: id, state: "on", attributes: { friendly_name: name, device_class: dc } }]),
      );

      const panel = document.querySelector("energy-mapper-panel");
      function hass() {
        const dark = $("theme").value === "dark";
        document.documentElement.classList.toggle("dark", dark);
        return {
          language: $("language").value,
          locale: {
            language: $("language").value,
            number_format: $("number_format").value,
            time_format: $("time_format").value,
            time_zone: "server",
          },
          config: { time_zone: "Europe/Berlin" },
          user: { is_admin: $("admin").checked, name: "Dev" },
          themes: { theme: "default", darkMode: dark },
          states: STATES,
          callWS,
        };
      }
      const mql = matchMedia("(max-width: 870px)");
      function update() {
        panel.hass = hass();
        panel.narrow = mql.matches;
      }
      mql.addEventListener("change", update);
      for (const el of document.querySelectorAll("#dev select, #dev input")) {
        el.addEventListener("change", () => {
          if (el.id === "scenario") {
            // reload: the panel reads the status once
            const p = new URLSearchParams(location.search);
            p.set("scenario", el.value);
            location.search = p.toString();
          } else update();
        });
      }
      window.addEventListener("hass-toggle-menu", () => console.log("hass-toggle-menu"));
      update();
    </script>
  </body>
</html>
